<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A Momo Invitation 🥟</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg1:#ffe3ee;--bg2:#ffd0e0;--text:#5a1f3a;--card:rgba(255,255,255,.72);--accent:#e8548a;--accent2:#ff8fb3;--ring:rgba(232,84,138,.25);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#2a1030;--bg2:#47173f;--text:#ffe6f0;--card:rgba(255,255,255,.09);--ring:rgba(255,143,179,.25)}}
:root[data-theme="dark"]{--bg1:#2a1030;--bg2:#47173f;--text:#ffe6f0;--card:rgba(255,255,255,.09);--ring:rgba(255,143,179,.25)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:linear-gradient(160deg,var(--bg1),var(--bg2));color:var(--text);font-family:'Poppins',system-ui,sans-serif;overflow-x:hidden;display:flex;align-items:center;justify-content:center}
main{width:100%;max-width:520px;padding:16px;position:relative;z-index:2}
.scene{display:none;text-align:center;background:var(--card);backdrop-filter:blur(8px);border-radius:28px;padding:24px 18px;box-shadow:0 10px 40px var(--ring);animation:pop .6s ease}
.scene.show{display:block}
@keyframes pop{from{opacity:0;transform:translateY(20px) scale(.96)}to{opacity:1;transform:none}}
h2{font-family:'Dancing Script',cursive;font-size:2rem;margin:0 0 6px}
p{line-height:1.6;margin:8px 0}
#tw{font-size:1.05rem;min-height:11em;text-align:left}
.cursor::after{content:"▍";animation:blink 1s infinite;color:var(--accent)}
@keyframes blink{50%{opacity:0}}
button{font:600 1rem 'Poppins',system-ui,sans-serif;border:0;border-radius:999px;padding:13px 24px;margin:8px 4px;cursor:pointer;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 6px 18px var(--ring);transition:transform .15s}
button:active{transform:scale(.94)}
button.ghost{background:transparent;color:var(--text);border:2px solid var(--accent);box-shadow:none}
.hint{font-size:.85rem;opacity:.8}
.stage{--S:min(86vw,440px);width:var(--S);height:var(--S);position:relative;margin:8px auto;touch-action:none;user-select:none;-webkit-user-select:none;border-radius:50%;background:radial-gradient(circle,var(--ring),transparent 70%);font-size:calc(var(--S)*.1)}
.food{position:absolute;width:20%;height:20%;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:transform .3s,opacity .4s,filter .3s;line-height:1}
.food small{font-size:calc(var(--S)*.032);margin-top:2px;font-weight:600}
.food.near{transform:translate(-50%,-50%) scale(1.3);filter:drop-shadow(0 0 10px var(--accent))}
.food.hit{animation:hit .9s forwards}
.stage.done .food:not(.hit){opacity:.15}
@keyframes hit{50%{transform:translate(-50%,-50%) scale(1.8) rotate(10deg)}100%{transform:translate(-50%,-50%) scale(1.5)}}
#bow{position:absolute;left:50%;top:50%;width:34%;height:34%;margin:-17% 0 0 -17%;transition:transform .08s}
#arrowWrap{position:absolute;left:50%;top:50%;width:0;height:0;display:none}
#arrowWrap svg{position:absolute;left:0;top:-5px;width:56px;height:10px;transition:transform .55s cubic-bezier(.3,.1,.6,1)}
.big{font-size:4.5rem;line-height:1.1;margin:6px 0}
.please{font-family:'Dancing Script',cursive;font-size:3.4rem;color:var(--accent);animation:shake .5s infinite}
@keyframes shake{25%{transform:rotate(-4deg) scale(1.08)}75%{transform:rotate(4deg) scale(1.08)}}
.cry{animation:bob .6s infinite alternate}
@keyframes bob{to{transform:translateY(8px) rotate(4deg)}}
.tear{position:absolute;pointer-events:none;animation:fall 1.2s linear forwards}
@keyframes fall{to{transform:translateY(120px);opacity:0}}
.snow{position:fixed;top:-30px;pointer-events:none;z-index:1;animation:snow linear infinite;opacity:.7}
@keyframes snow{to{transform:translate(30px,110vh)}}
.fx{position:fixed;pointer-events:none;z-index:5;animation:rise 2.2s ease-out forwards}
@keyframes rise{to{transform:translateY(-70vh) rotate(40deg);opacity:0}}
</style>
</head>
<body>
<main>
  <section id="s1" class="scene show">
    <h2>A little invitation ❄️</h2>
    <p id="tw" class="cursor"></p>
    <button id="b1" hidden>Tell me more 💌</button>
  </section>

  <section id="s2" class="scene">
    <h2>What are you craving? 🥟</h2>
    <p class="hint">Touch and drag to aim the bow, then let go to shoot your favourite food 🏹</p>
    <div class="stage" id="stage">
      <svg id="bow" viewBox="0 0 140 120">
        <path d="M70 8 Q108 60 70 112" fill="none" stroke="#b5651d" stroke-width="7" stroke-linecap="round"/>
        <path id="str" d="M70 8 L62 60 L70 112" fill="none" stroke="#fff" stroke-width="2.5"/>
        <g id="ar"><line id="arl" x1="62" y1="60" x2="128" y2="60" stroke="#8b5a2b" stroke-width="3"/><polygon points="128,54 140,60 128,66" fill="#e8548a"/></g>
      </svg>
      <div id="arrowWrap"><svg viewBox="0 0 56 10"><line x1="2" y1="5" x2="48" y2="5" stroke="#8b5a2b" stroke-width="2.5"/><polygon points="48,0 56,5 48,10" fill="#e8548a"/><polygon points="0,0 8,5 0,10 4,5" fill="#ff8fb3"/></svg></div>
    </div>
  </section>

  <section id="s3" class="scene">
    <div class="big" id="e3">🥟</div>
    <p id="t3"></p>
    <div id="btn3"></div>
  </section>

  <section id="s5" class="scene">
    <div class="big cry" id="cryface">😭</div>
    <div class="big">👶</div>
    <p id="t5">Waaaah… 😭😭</p>
    <div id="btn5"></div>
  </section>

  <section id="s6" class="scene">
    <div class="big">🥳</div>
    <h2>Yaaay! It’s an outing! 🎉</h2>
    <p id="t6"></p>
    <p class="hint">Winter + hot momos + you = perfect ❄️🥟</p>
  </section>
</main>

<script>
const $=id=>document.getElementById(id);
const foods=[["🥟","Momo"],["🍵","Hot Tea"],["🥐","Pastry"],["🍰","Cake"],["☕","Coffee"],["🍜","Chowmin"],["🍟","Fries"]];
let chosen=foods[0],state=0,AC=null,cryTimer=null;
function show(id){document.querySelectorAll('.scene').forEach(s=>s.classList.remove('show'));$(id).classList.add('show')}

/* snow */
for(let i=0;i<36;i++){const s=document.createElement('div');s.className='snow';s.textContent='❄';
s.style.left=Math.random()*100+'vw';s.style.fontSize=(10+Math.random()*16)+'px';
s.style.animationDuration=(7+Math.random()*9)+'s';s.style.animationDelay=(-Math.random()*12)+'s';document.body.appendChild(s)}

function burst(list,n){for(let i=0;i<n;i++){const f=document.createElement('div');f.className='fx';
f.textContent=list[i%list.length];f.style.left=Math.random()*95+'vw';f.style.top=(60+Math.random()*35)+'vh';
f.style.fontSize=(18+Math.random()*24)+'px';f.style.animationDelay=Math.random()*.6+'s';document.body.appendChild(f);setTimeout(()=>f.remove(),3200)}}

/* audio */
function ctx(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function say(t,rate,pitch){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.volume=1;u.rate=rate||.9;u.pitch=pitch||1.4;speechSynthesis.speak(u)}catch(e){}}
function wail(){const a=ctx();if(!a)return;const t0=a.currentTime;
for(let i=0;i<4;i++){const t=t0+i*1.0,o=a.createOscillator(),g=a.createGain(),f=a.createBiquadFilter(),l=a.createOscillator(),lg=a.createGain();
o.type='sawtooth';f.type='lowpass';f.frequency.value=1400;
o.frequency.setValueAtTime(420,t);o.frequency.linearRampToValueAtTime(640,t+.25);o.frequency.linearRampToValueAtTime(380,t+.85);
l.frequency.value=7;lg.gain.value=22;l.connect(lg);lg.connect(o.frequency);
g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.28,t+.12);g.gain.linearRampToValueAtTime(.2,t+.6);g.gain.linearRampToValueAtTime(0,t+.9);
o.connect(f);f.connect(g);g.connect(a.destination);o.start(t);l.start(t);o.stop(t+1);l.stop(t+1)}}
function tune(){const a=ctx();if(!a)return;[523,659,784,1047].forEach((fr,i)=>{const t=a.currentTime+i*.14,o=a.createOscillator(),g=a.createGain();o.type='triangle';o.frequency.value=fr;
g.gain.setValueAtTime(.2,t);g.gain.exponentialRampToValueAtTime(.001,t+.4);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+.45)})}

/* scene 1 typewriter */
const msg="Hi beautiful girl ✨ How are you? I hope you’re doing wonderfully. It’s December, the air is chilly, and I can’t think of anything better than a plate of steaming hot momos 🥟 Would you like to come with me to a momo stall for an hour or two? I know your studies keep you super busy, so if you can spare just 2 hours from your busy life, I’ll be truly grateful 😊";
let ti=0,twDone=false;
function type(){if(ti<msg.length){$('tw').textContent=msg.slice(0,++ti);setTimeout(type,32)}else finishTw()}
function finishTw(){twDone=true;$('tw').textContent=msg;$('tw').classList.remove('cursor');$('b1').hidden=false}
$('s1').addEventListener('click',e=>{if(!twDone&&e.target.tagName!=='BUTTON'){ti=msg.length}});
setTimeout(type,500);
$('b1').onclick=()=>{ctx();show('s2')};

/* scene 2 bow */
const stage=$('stage'),N=foods.length,ang=[];
foods.forEach((f,i)=>{const a=i*360/N-90;ang.push(a);const d=document.createElement('div');d.className='food';
d.style.left=(50+40*Math.cos(a*Math.PI/180))+'%';d.style.top=(50+40*Math.sin(a*Math.PI/180))+'%';
d.innerHTML=f[0]+'<small>'+f[1]+'</small>';stage.appendChild(d)});
const items=[...stage.querySelectorAll('.food')];
let aiming=false,cur=0,curA=0,busy=false;
function pos(e){const r=stage.getBoundingClientRect();return{x:e.clientX-r.left-r.width/2,y:e.clientY-r.top-r.height/2,S:r.width}}
function nearest(a){let b=0,m=999;ang.forEach((x,i)=>{let d=Math.abs(((a-x+540)%360)-180);if(d<m){m=d;b=i}});return b}
function aim(e){const p=pos(e),a=Math.atan2(p.y,p.x)*180/Math.PI;curA=a;
const pull=Math.max(8,Math.min(34,Math.hypot(p.x,p.y)/p.S*90));
$('bow').style.transform='rotate('+a+'deg)';
$('str').setAttribute('d','M70 8 L'+(70-pull)+' 60 L70 112');
$('arl').setAttribute('x1',70-pull);
cur=nearest(a);items.forEach((it,i)=>it.classList.toggle('near',i===cur))}
stage.addEventListener('pointerdown',e=>{if(busy)return;aiming=true;stage.setPointerCapture(e.pointerId);aim(e)});
stage.addEventListener('pointermove',e=>{if(aiming&&!busy)aim(e)});
stage.addEventListener('pointerup',e=>{if(!aiming||busy)return;aiming=false;shoot()});
function shoot(){busy=true;$('ar').style.display='none';
$('str').setAttribute('d','M70 8 L70 60 L70 112');
const t=items[cur],sr=stage.getBoundingClientRect(),tr=t.getBoundingClientRect();
const dx=tr.left+tr.width/2-sr.left-sr.width/2,dy=tr.top+tr.height/2-sr.top-sr.height/2;
const dist=Math.hypot(dx,dy)-tr.width*.3,a=Math.atan2(dy,dx)*180/Math.PI;
const w=$('arrowWrap');w.style.display='block';w.style.transform='rotate('+a+'deg)';
const sv=w.firstElementChild;sv.style.transition='none';sv.style.transform='translateX(20px)';
requestAnimationFrame(()=>requestAnimationFrame(()=>{sv.style.transition='';sv.style.transform='translateX('+(dist-56)+'px)'}));
const a2=ctx();if(a2){const o=a2.createOscillator(),g=a2.createGain();o.frequency.setValueAtTime(900,a2.currentTime);o.frequency.exponentialRampToValueAtTime(200,a2.currentTime+.5);g.gain.setValueAtTime(.15,a2.currentTime);g.gain.linearRampToValueAtTime(0,a2.currentTime+.5);o.connect(g);g.connect(a2.destination);o.start();o.stop(a2.currentTime+.5)}
setTimeout(()=>{items.forEach(i=>i.classList.remove('near'));t.classList.add('hit');stage.classList.add('done');tune();burst(['⭐',chosenEmoji(),'✨'],14)},560);
chosen=foods[cur];
setTimeout(()=>{state=0;render();show('s3')},1900)}
function chosenEmoji(){return foods[cur][0]}

/* scene 3: ask / please */
function render(){$('e3').textContent=chosen[0];
const b=$('btn3');b.innerHTML='';
if(state===0){$('t3').innerHTML='Great aim, your highness! 🏹 You picked <b>'+chosen[1]+'</b>. So… will you come with me to the momo stall? 🥟❄️';
mk(b,'Yes, let’s go! 🥟',yes);mk(b,'No, I can’t 🙈',()=>{state=1;render();say('Please! Please! Please come with me!',.85,1.5);burst(['🥺','🙏'],8)},'ghost')}
else{$('e3').innerHTML='<span class="please">PLEASE 🥺</span>';$('t3').textContent='Just 2 little hours… I’ll even pay for the '+chosen[1].toLowerCase()+'! 🥹';
mk(b,'Okay, I’ll come 🥟',yes);mk(b,'Still no 😤',cryScene,'ghost')}}
function mk(p,t,f,c){const x=document.createElement('button');x.textContent=t;if(c)x.className=c;x.onclick=f;p.appendChild(x)}

function yes(){try{speechSynthesis.cancel()}catch(e){}clearInterval(cryTimer);
$('t6').innerHTML='You’re coming for hot <b>'+chosen[1]+'</b> '+chosen[0]+' in December. Can’t wait to see you smile! 😊';
show('s6');tune();burst(['🥟','❄️','🎉','✨','☕'],30);setInterval(()=>burst(['🥟','❄️','🎉'],6),2500)}

function cryScene(){show('s5');$('t5').textContent='Waaaah… 😭😭';$('btn5').innerHTML='';
try{speechSynthesis.cancel()}catch(e){}
wail();say('Waaaah! Waaaah!',.7,2);
cryTimer=setInterval(()=>{const t=document.createElement('div');t.className='tear';t.textContent='💧';
t.style.left=(35+Math.random()*30)+'%';t.style.top='22%';$('s5').style.position='relative';$('s5').appendChild(t);setTimeout(()=>t.remove(),1300)},250);
setTimeout(()=>{clearInterval(cryTimer);$('cryface').classList.remove('cry');
$('t5').innerHTML='<span style="font-family:\'Dancing Script\',cursive;font-size:2rem">Okk, as you wish, your highness 👑</span>';
mk($('btn5'),'Wait… I’ll come 🥹',yes)},4200)}
</script>
</body>
</html>
